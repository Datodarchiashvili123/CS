<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dogs</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4d48a;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #be4431;
            background-color: transparent;
            border: 2px solid #be4431;
            border-radius: 10px;
            padding: 10px 25px;
            width: fit-content;
            margin: 20px auto;
        }

        #breeds {
            max-width: 1200px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        .card h2 {
            margin-top: 0;
            color: #444;
        }

        .card p {
            color: #666;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <h1>Dog Breeds</h1>

    <div id="breeds"></div>

    <script src="script.js"></script>

</body>
</html>
